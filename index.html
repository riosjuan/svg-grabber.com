			<h1 class="title">
				Grab all the SVGs<br />
				from any website

			<p class="description">
				Preview, download, or copy the code for any SVG icon or illustration, ready to use in

			</p>
			<a
				class="button button--primary"
				href="https://chromewebstore.google.com/detail/svg-grabber-get-all-the-s/eafjmnaiohflfhelegodfedimibnjpgp"

			<img
				class="screenshot"
				src="/svg-grabber-01.png"
				alt="A browser window displaying the “svg-grabber” Chrome extension page, showing a header that says “All SVGs from → Home / X” with a link to x.com/home. Below it is a grid of large icon previews, each in a white card with “Copy” and “Download” buttons. Visible icons include an envelope with a plus sign, double upward arrows, the stylized X logo, a house icon, and a magnifying glass search icon."
			/>
